name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p work
          unzip -q scenesheet.zip -d work

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find work -name pubspec.yaml -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Update file_picker
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's/file_picker: \^8\.1\.2/file_picker: ^10.3.6/' pubspec.yaml
          grep "file_picker:" pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Force compileSdk 36
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
          fi

      - name: Verify compileSdk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== Android build.gradle.kts ====="
          if [ -f android/app/build.gradle.kts ]; then
            grep -n "compileSdk" android/app/build.gradle.kts || true
          fi

          echo "===== Android build.gradle ====="
          if [ -f android/app/build.gradle ]; then
            grep -n "compileSdk" android/app/build.gradle || true
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scenesheet-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
