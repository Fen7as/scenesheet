name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p work
          unzip -q scenesheet.zip -d work

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find work -name pubspec.yaml -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          rm -f pubspec.lock
          flutter pub get

      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== file_picker (pinned once, in pubspec.yaml) ====="
          grep "file_picker:" pubspec.yaml
          flutter pub deps | grep -A 2 -B 2 "file_picker" || true

      - name: Restore app icon (flutter create must not leave the default icon)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cp -r design/android_res/. android/app/src/main/res/

      - name: Set launcher label to SceneSheet
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's/android:label="[^"]*"/android:label="SceneSheet"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="SceneSheet"' android/app/src/main/AndroidManifest.xml

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Force compileSdk 36
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
          fi

      - name: Verify compileSdk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== compileSdk ====="

          if [ -f android/app/build.gradle.kts ]; then
            grep -n "compileSdk" android/app/build.gradle.kts || true
          fi

          if [ -f android/app/build.gradle ]; then
            grep -n "compileSdk" android/app/build.gradle || true
          fi

      - name: Analyze (compile errors fail the build)
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests (a failing test fails the build)
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Compute build number
        run: |
          # Minutes since 2026-01-01 UTC: always increasing, independent of run counters or reruns,
          # and far above any earlier versionCode (1 or a small run number).
          BUILD_NUMBER=$(( ($(date -u +%s) - 1767225600) / 60 + 1 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --build-number=$BUILD_NUMBER

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scenesheet-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
